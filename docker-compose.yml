version: "3.9"

services:
  # ─── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: restaron_db
    environment:
      POSTGRES_DB: restaron_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ni env faylida belgilang}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── FastAPI Backend ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaron_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?PostgreSQL async ulanish URL ini belgilang}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:?PostgreSQL sync ulanish URL ini belgilang}
      SECRET_KEY: ${SECRET_KEY:?Kamida 32 belgili maxfiy JWT kalitini belgilang}
      FRONTEND_URL: http://localhost:5173
      QR_BASE_URL: http://localhost:5173
      DEBUG: "False"
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── React Frontend ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restaron_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
